name: Build Base Image

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: linux/amd64
    outputs:
      digest:
        description: Digest of the server base image built from this revision
        value: ${{ jobs.build-base.outputs.digest }}
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platforms
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build-base:
    name: Build and push server base image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets.'
            exit 1
          fi
          echo "IMAGE=${DOCKERHUB_USERNAME,,}/${REPOSITORY_NAME,,}" >> "$GITHUB_ENV"

      - name: Free disk space for Python dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate base image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=server-base,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=server-base_sha-

      - name: Build and push server base image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server-base
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha,scope=server-base
          cache-to: type=gha,mode=max,scope=server-base
